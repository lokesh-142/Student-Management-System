<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile | SIMS</title><link rel="stylesheet" href="/css/style.css"></head><body class="app"><aside class="sidebar"><div class="brand"><span class="brand-mark">S</span><div><strong>SIMS</strong><small>Student Portal</small></div></div><nav><a href="/student/dashboard">⌂ <span>Dashboard</span></a><a class="active" href="/student/profile">◎ <span>My Profile</span></a><a href="/logout">⇥ <span>Logout</span></a></nav></aside><main class="main"><header class="topbar"><div><span class="eyebrow">PROFILE</span><h1>Student information</h1></div></header><form class="panel form-grid" method="post" action="/student/profile"><label>Student ID<input th:value="${student.sid}" disabled></label><label>Full name<input name="name" th:value="${student.name}" required></label><label>Father name<input name="fatherName" th:value="${student.fatherName}"></label><label>Mother name<input name="motherName" th:value="${student.motherName}"></label><label>Email<input type="email" name="email" th:value="${student.email}"></label><label>Phone<input name="phone" th:value="${student.phone}"></label><label>Department<input name="department" th:value="${student.department}"></label><label>Year<input type="number" name="year" th:value="${student.year}" min="1" max="4"></label><label class="wide">Address<textarea name="address" rows="4" th:text="${student.address}"></textarea></label><div class="wide actions"><button class="primary">Save changes</button><a class="light-btn" href="/student/dashboard">Cancel</a></div></form></main></body></html>
