<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Student | SIMS</title><link rel="stylesheet" href="/css/style.css"></head><body class="app"><aside class="sidebar"><div class="brand"><span class="brand-mark">S</span><div><strong>SIMS</strong><small>Admin Console</small></div></div><nav><a href="/admin/dashboard">⌂ <span>Dashboard</span></a><a class="active" href="/admin/students">◉ <span>Students</span></a><a href="/admin/courses">▣ <span>Courses</span></a><a href="/logout">⇥ <span>Logout</span></a></nav></aside><main class="main"><header class="topbar"><div><span class="eyebrow">STUDENT MANAGEMENT</span><h1>Add student</h1></div></header><form class="panel form-grid" method="post" action="/admin/students/save"><label>Student ID<input type="number" name="sid" required></label><label>Full name<input name="name" required></label><label>Father name<input name="fatherName"></label><label>Mother name<input name="motherName"></label><label>Gender<input name="gender"></label><label>Date of birth<input type="date" name="dob"></label><label>Email<input type="email" name="email"></label><label>Phone<input name="phone"></label><label class="wide">Address<textarea name="address" rows="3"></textarea></label><label>Department<input name="department"></label><label>Year<input type="number" name="year" min="1" max="4"></label><label>Username<input name="username" required></label><label>Password<input type="password" name="password" required></label><div class="wide actions"><button class="primary">Create student</button><a class="light-btn" href="/admin/students">Cancel</a></div></form></main></body></html>
