<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Courses | SIMS</title><link rel="stylesheet" href="/css/style.css"></head><body class="app"><aside class="sidebar"><div class="brand"><span class="brand-mark">S</span><div><strong>SIMS</strong><small>Admin Console</small></div></div><nav><a href="/admin/dashboard">⌂ <span>Dashboard</span></a><a href="/admin/students">◉ <span>Students</span></a><a class="active" href="/admin/courses">▣ <span>Courses</span></a><a href="/logout">⇥ <span>Logout</span></a></nav></aside><main class="main"><header class="topbar"><div><span class="eyebrow">COURSE MANAGEMENT</span><h1>Courses</h1></div></header><section class="grid-2"><div class="panel"><div class="panel-head"><div><span class="eyebrow">CATALOGUE</span><h3>Available courses</h3></div></div><div class="course-list"><div th:each="c:${courses}"><span><b th:text="${c.courseId}">1</b> <span th:text="${c.courseName}">Java</span></span><span><b th:text="${c.credits}">4</b> credits <form class="inline" th:action="@{'/admin/courses/delete/'+${c.courseId}}" method="post"><button class="danger">Delete</button></form></span></div></div></div><form class="panel" method="post" action="/admin/courses/save"><span class="eyebrow">NEW COURSE</span><h3>Add course</h3><label>Course name<input name="courseName" required></label><label>Credits<input type="number" name="credits" min="0" max="10" required></label><button class="primary full">Add course</button></form></section></main></body></html>
