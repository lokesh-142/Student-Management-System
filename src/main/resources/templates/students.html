<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Students | SIMS</title><link rel="stylesheet" href="/css/style.css"></head><body class="app"><aside class="sidebar"><div class="brand"><span class="brand-mark">S</span><div><strong>SIMS</strong><small>Admin Console</small></div></div><nav><a href="/admin/dashboard">⌂ <span>Dashboard</span></a><a class="active" href="/admin/students">◉ <span>Students</span></a><a href="/admin/courses">▣ <span>Courses</span></a><a href="/logout">⇥ <span>Logout</span></a></nav></aside><main class="main"><header class="topbar"><div><span class="eyebrow">STUDENT MANAGEMENT</span><h1>Students</h1></div><a class="primary" href="/admin/students/new">+ Add student</a></header><div class="panel"><div class="search"><input id="studentSearch" placeholder="Search by name, department or ID…"></div><div class="table-wrap"><table id="studentTable"><thead><tr><th>ID</th><th>Student</th><th>Department</th><th>Year</th><th>Phone</th><th>Actions</th></tr></thead><tbody><tr th:each="s:${students}"><td th:text="${s.sid}">1</td><td><strong th:text="${s.name}">Name</strong><small class="muted" th:text="${s.email}">email</small></td><td th:text="${s.department}">IT</td><td th:text="${s.year}">4</td><td th:text="${s.phone}">000</td><td class="actions"><a class="icon-btn" th:href="@{'/admin/records/'+${s.sid}}">View</a><form th:action="@{'/admin/students/delete/'+${s.sid}}" method="post"><button class="danger" onclick="return confirm('Delete this student and related records?')">Delete</button></form></td></tr></tbody></table></div></div></main><script src="/js/app.js"></script></body></html>
